generations:
  - name: "Third Generation (M300)"
    start_year: 2009
    end_year: 2012
    description: "The third-generation Chevrolet Spark (M300) was launched in 2009 and based on the 2007 Chevrolet Beat concept car. It was unveiled at the 2009 Geneva Motor Show and became available in Europe in the first quarter of 2010. The car was designed by Taewan Kim and used the GM Gamma II platform. Engine options included a 1.0L and 1.2L four-cylinder S-TEC II engine. In North America, the Spark was not initially available, but GM began production for the US market in April 2012 for the 2013 model year. The M300 featured a taller, more upright design compared to previous generations, with the characteristic 'Beat' styling that defined this generation globally. In India, it was launched as the Chevrolet Beat in 2010, while in Australia and New Zealand it was badged as the Holden Barina Spark."

  - name: "Third Generation (M300, 2013 Facelift)"
    start_year: 2013
    end_year: 2015
    description: "The first facelift of the M300 generation was revealed at the 2012 Paris Motor Show with a redesigned dual-port grille, front bumper, restyled headlamp covers, and fog lamps. The North American model launched for the 2013 model year in August 2012 with an upstroke version of the 1.2L S-TEC II engine (RPO code LL0) producing 84 HP. In North America, the car was available in LS, 1LT, and 2LT trim levels, with both five-speed manual and four-speed automatic transmissions. The facelifted styling was also applied to the Indian market Beat starting in February 2014. The 2013 Spark became the fastest-selling car in the United States for July 2012, with just 6 days from dealer arrival to sale. The Spark EV, an all-electric variant with a 130 HP electric motor and approximately 82 miles of range, was offered in the United States from June 2013 through 2016 in select California and Oregon markets, representing the first all-electric passenger car marketed by GM since the EV1."

  - name: "Fourth Generation (M400)"
    start_year: 2015
    end_year: 2018
    description: "The fourth-generation Spark (M400) was styled under GM Global Design Chief Michael Simcoe, debuted at the April 2015 New York International Auto Show, and went on sale in the fourth quarter of 2015. Production began globally in 2015, with the 2016 North American model year arriving in dealerships in late 2015. In North America, the M400 is powered by a 1.4L four-cylinder LV7 DOHC engine producing 98 HP and 94 lb-ft of torque, paired with a five-speed manual transmission or continuously variable transmission (CVT). International markets, including Korea, Europe, and Australia, received a 1.0L engine producing 75 HP. The M400 featured updated exterior styling with a more mature appearance compared to the M300, revised instrument panel, and improved interior materials. Internationally, the fourth-generation Spark was also sold as the Holden Spark in Australia and New Zealand (starting February 2016), Opel Karl in Europe, Vauxhall Viva in the UK, and VinFast Fadil in Vietnam. Production ceased in August 2022."

  - name: "Fourth Generation (M400, 2018 Facelift)"
    start_year: 2018
    end_year: 2022
    description: "The mid-cycle facelift of the M400 generation occurred in 2018 for the 2019 model year. In North America, the facelifted Spark went on sale in the third quarter of 2018 with revised exterior styling, a new third-generation seven-inch Chevrolet Infotainment 3 system, and new exterior color options. Optional low-speed autonomous emergency braking (AEB) was added to selected models. For the 2018 model year, GM also introduced the ACTIV trim level (between 1LT and 2LT), featuring leatherette-trimmed seats, heated front seats, leather-wrapped steering wheel, aluminum alloy wheels, unique black exterior styling elements, roof rails, and increased ground clearance of 0.4 inches (not offered in Canada). The facelifted Spark maintained its position as the least expensive new car in the United States and Canada. Production ended in August 2022, with the Spark discontinued without a direct replacement as consumer preferences shifted toward larger vehicles and GM reduced its small car offerings in North America. Holden discontinued the Spark in Australia in April 2018, though it continued in New Zealand until the Holden brand's demise in 2020."
